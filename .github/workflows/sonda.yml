name: sonda das rádios
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # de 15 em 15 min, fora do minuto :00
  workflow_dispatch:
jobs:
  ouvir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: escutar as 3 rádios
        env:
          HC_MACEIO: ${{ secrets.HC_MACEIO }}
          HC_DELMIRO: ${{ secrets.HC_DELMIRO }}
          HC_GOSPEL: ${{ secrets.HC_GOSPEL }}
        run: bash sonda.sh
      # VPS fora? Diz se é a Hostinger (23/10/2026) — ver vigia_vps.py
      - name: vigia da VPS (causa provável no Telegram)
        if: always()
        env:
          HC_API_KEY: ${{ secrets.HC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 vigia_vps.py
